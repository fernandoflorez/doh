# Each key is a command line flag (cache_size and cache-size both work).
# Flags given on the command line take precedence over this file.

# db_path = "doh_blocklist.db"
# listen = "127.0.0.1:53"

# user = "nobody"        # switch to this user after binding (start as root)

# Built-in: google, cloudflare, quad9, opendns. Custom: "NAME=URL" (https only).
# servers = ["cloudflare", "quad9", "mine=https://doh.example.com/dns-query"]

# upstream_timeout = 5          # seconds
# max_upstream_queries = 256    # cache misses in flight
# cache_size = 10000            # entries
# cache_max_mb = 32             # megabytes
# max_ttl = 86400               # seconds
# blocked_ttl = 60              # seconds
# tcp_timeout = 10              # seconds
# max_tcp_connections = 256     # simultaneous TCP clients
# stats_retention = 60          # days
# stats_max_rows = 1000000      # rows per statistics table
# verbose = false
